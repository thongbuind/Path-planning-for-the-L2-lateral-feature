# Evaluation plan of PP-TS-014 (research/README.md, step 2). Reviewed and locked 2026-11-12,
# with the variants revised before any run (study.md section 2).
id: PP-TS-014
locked: 2026-11-12
suite: PP-TS-014        # benchmark/suites/PP-TS-014.yaml: its tuning and test runs, seeds and scope
parts: [tuning, test]
equal_within:
  PP-SWR-050: 0.005
  PP-SWR-051: 0.01
# Tuning budget: kappa_far_rate at three levels for V2 and V3; the level is chosen on the
# tuning part, the variants are compared on the test part.
variants:
  V0:
    description: Bản hiện tại; T4 một λ, cung tròn ngoài tầm nhìn
    calibration: {}
    cmake: {PP_T4_BLEND: single, PP_T2_BEYOND: arc}
  V1:
    description: T4 một λ cho từng điểm, không tăng theo t
    calibration: {}
    cmake: {PP_T4_BLEND: per_time, PP_T2_BEYOND: arc}
  V2-r1:
    description: Độ cong ngoài tầm nhìn đổi tối đa 2,5e-4 1/m/s
    calibration: {kappa_far_rate: 2.5e-4}
    cmake: {PP_T4_BLEND: single, PP_T2_BEYOND: rate_limited}
  V2-r2:
    description: Độ cong ngoài tầm nhìn đổi tối đa 5e-4 1/m/s
    calibration: {kappa_far_rate: 5.0e-4}
    cmake: {PP_T4_BLEND: single, PP_T2_BEYOND: rate_limited}
  V2-r3:
    description: Độ cong ngoài tầm nhìn đổi tối đa 1e-3 1/m/s
    calibration: {kappa_far_rate: 1.0e-3}
    cmake: {PP_T4_BLEND: single, PP_T2_BEYOND: rate_limited}
  V3-r1:
    description: V1 và V2, 2,5e-4 1/m/s
    calibration: {kappa_far_rate: 2.5e-4}
    cmake: {PP_T4_BLEND: per_time, PP_T2_BEYOND: rate_limited}
  V3-r2:
    description: V1 và V2, 5e-4 1/m/s
    calibration: {kappa_far_rate: 5.0e-4}
    cmake: {PP_T4_BLEND: per_time, PP_T2_BEYOND: rate_limited}
  V3-r3:
    description: V1 và V2, 1e-3 1/m/s
    calibration: {kappa_far_rate: 1.0e-3}
    cmake: {PP_T4_BLEND: per_time, PP_T2_BEYOND: rate_limited}
