# Mô tả generator lab. Quy tắc ở research/generators/README.md.
name: qp_jerk_admm_shift_warmstart
base: qp_jerk_admm          # Generator gốc: cùng bài toán QP, trọng số mặc định, qp_iters; chỉ khác warm start
study: PP-TS-031
telemetry:
  work: số vòng ADMM            # Đơn vị của pp_t7_telemetry_t.work
  # Ở generator này fallback là lý do KHÔNG dịch warm start; khi đó warm start giống hệt qp_jerk_admm.
  fallback:
    1: NO_WARM (chu kỳ đầu sau reset hoặc lần giải trước thất bại; khởi động lạnh như qp_jerk_admm)
    2: FROM_CAR (start_from_car; điểm đầu là trạng thái đo)
    3: NOT_FROM_OLD (from_old false hoặc không có path cũ)
    4: FOLLOW_CHANGED (follow khác lần giải trước; gồm lần gọi thứ hai trong cùng chu kỳ)
    5: BAD_SHIFT (old->shift_s không hữu hạn hoặc không dương)
# Tham số calibration riêng: tên bắt đầu bằng calibration_prefix + "_", cùng định dạng với
# planner/calibration/calibration.yaml (value, unit, min, max, source).
calibration_prefix: sws
calibration:
  # Biến ADMM được dịch: 0 chỉ jerk; 1 cả x (jerk và hai biến nới); 2 cả x và biến đối ngẫu y.
  # 1: dịch y làm lệch so với bản 1000 vòng tăng ở 10 và 25 vòng (notes.md).
  sws_shift_vars: {value: 1, unit: "-", min: 0, max: 2, source: "nhóm tự thống nhất; quick bench, notes.md"}
