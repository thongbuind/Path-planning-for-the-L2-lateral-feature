# Trajectory phát ở 40 Hz qua arbitrator tới Lateral Controller (ICD 6.1).
icd: "6.1"
constants:
  TRAJECTORY_POINTS: {type: uint, value: 31}
  TRAJECTORY_STEP_S: {type: float, value: 0.1}
  TRAJECTORY_HORIZON_S: {type: float, value: 3.0}
  TRAJECTORY_TIMEOUT_US: {type: uint64, value: 75000}
enums:
  PlannerId:
    doc: "Planner đã phát message (PP-SWR-019)."
    values: {LCC: 0, LKA_ELK: 1}
structs:
  TrajectoryPoint:
    fields:
      - {name: time_from_start, type: float32, unit: s}
      - {name: pose, type: Pose2D, doc: "base_link tại header.stamp_us; yaw là hướng tiếp tuyến của path."}
      - {name: longitudinal_velocity_mps, type: float32, unit: m/s}
      - {name: lateral_velocity_mps, type: float32, unit: m/s, doc: "d_dot theo đường tham chiếu; khác v_y của thân xe."}
      - {name: acceleration_mps2, type: float32, unit: m/s^2}
      - {name: heading_rate_rps, type: float32, unit: rad/s}
      - {name: curvature, type: float32, unit: 1/m}
      - {name: front_wheel_angle_rad, type: float32, unit: rad}
      - {name: rear_wheel_angle_rad, type: float32, unit: rad, doc: "Luôn bằng 0."}
  Trajectory:
    fields:
      - {name: header, type: Header, doc: "stamp_us = t0 trong khung BASE_LINK."}
      - {name: points, type: TrajectoryPoint, count: TRAJECTORY_POINTS}
      - {name: observed_horizon_s, type: float32, unit: s, doc: "Thời gian tới lúc path rời phạm vi lane model đã quan sát. Các điểm sau đó được ngoại suy (PP-SWR-018)."}
      - {name: planner_id, type: PlannerId}
