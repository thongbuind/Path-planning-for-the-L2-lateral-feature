icd: "6.3"
constants:
  INTERVENTION_STATUS_TIMEOUT_US: {type: uint64, value: 75000}
enums:
  InterventionFunction:
    values: {NONE: 0, LKA: 1, ELK: 2}
  InterventionPhase:
    values: {NONE: 0, ACTIVE: 1, COMPLETED: 2}
structs:
  InterventionStatus:
    fields:
      - {name: header, type: BasicHeader}
      - {name: path_valid, type: bool, doc: "Đầu vào đủ hợp lệ để dựng path khi có yêu cầu. Cờ có thể true khi chưa can thiệp."}
      - {name: active_function, type: InterventionFunction, doc: "NONE khi thiếu yêu cầu hoặc path_valid là false."}
      - {name: lka_phase, type: InterventionPhase}
      - {name: elk_phase, type: InterventionPhase}
      - {name: lateral_limit_reached, type: bool, doc: "Path bị cắt theo giới hạn a_y hoặc jerk khi LKA/ELK hoạt động. Chỉ dùng ghi log."}
