icd: "6.2"
constants:
  LCC_STATUS_TIMEOUT_US: {type: uint64, value: 75000}
enums:
  LccMode:
    doc: "Cách LCC dựng path (PP-SWR-177)."
    values: {NONE: 0, LANE: 1, INFERRED: 2, FOLLOW: 3, COAST: 4}
structs:
  LccStatus:
    fields:
      - {name: header, type: BasicHeader}
      - {name: path_valid, type: bool}
      - {name: lcc_mode, type: LccMode, doc: "NONE khi LCC không ở REQUEST hoặc path_valid là false."}
      - {name: follow_distance, type: float32, unit: m, doc: "Quãng đường từ đầu FOLLOW, bằng 0 ở mode khác. Chỉ dùng để ghi log và hiển thị."}
      - {name: lateral_limit_reached, type: bool}
      - {name: lane_too_narrow, type: bool}
