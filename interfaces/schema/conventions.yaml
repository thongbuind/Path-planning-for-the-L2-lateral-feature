icd: "4"
constants:
  COUNTER_MODULO: {type: uint, value: 256}
enums:
  FrameId:
    values: {BASE_LINK: 0}
  Side:
    values: {NONE: 0, LEFT: 1, RIGHT: 2}
structs:
  Header:
    fields:
      - {name: stamp_us, type: uint64, unit: us, doc: "Thời điểm mà dữ liệu mô tả, theo đồng hồ bên phát (gPTP)."}
      - {name: counter, type: uint8, doc: "Tăng 1 mỗi lần phát, quay vòng tại 256."}
      - {name: valid, type: bool, doc: "Hiệu lực của toàn message."}
      - {name: frame_id, type: FrameId, doc: "BASE_LINK có gốc tại tâm trục sau; x tiến, y trái, z lên."}
  BasicHeader:
    doc: "Header không có frame_id, dùng cho trạng thái, yêu cầu và chassis signals."
    fields:
      - {name: stamp_us, type: uint64, unit: us}
      - {name: counter, type: uint8}
      - {name: valid, type: bool}
  Pose2D:
    fields:
      - {name: x, type: float32, unit: m}
      - {name: y, type: float32, unit: m}
      - {name: yaw, type: float32, unit: rad}
