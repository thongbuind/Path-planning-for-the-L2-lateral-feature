icd: "5.4"
constants:
  VEHICLE_STATE_TIMEOUT_US: {type: uint64, value: 60000}
  VEHICLE_STATE_MAX_DELTA_COUNTER: {type: uint, value: 4, doc: "Bước counter lớn nhất theo ICD 4: floor((60 + 25) / 20), với thời gian tính bằng ms."}
  VEHICLE_STATE_MAX_AGE_US: {type: uint64, value: 30000}
structs:
  VehicleStateEstimate:
    fields:
      - {name: header, type: Header, doc: "stamp_us theo thời điểm ước lượng."}
      - {name: lateral_velocity, type: float32, unit: m/s, doc: "v_y tại tâm trục sau."}
      - {name: lateral_velocity_variance, type: float32, unit: m^2/s^2}
      - {name: slip_angle, type: float32, unit: rad}
