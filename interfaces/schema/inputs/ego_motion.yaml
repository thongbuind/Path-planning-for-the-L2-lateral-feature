icd: "5.5"
constants:
  EGO_MOTION_WINDOW_US: {type: uint64, value: 500000, doc: "t1 và t2 trong 0,5 s vừa qua."}
structs:
  EgoMotionRequest:
    fields:
      - {name: t1_us, type: uint64, unit: us}
      - {name: t2_us, type: uint64, unit: us}
  EgoMotionResponse:
    doc: "Chuyển động base_link từ t1 đến t2, có trượt ngang, biểu diễn trong base_link tại t1."
    fields:
      - {name: valid, type: bool, doc: "Có thể là false khi bánh xe bị trượt."}
      - {name: dx, type: float32, unit: m}
      - {name: dy, type: float32, unit: m}
      - {name: dyaw, type: float32, unit: rad}
