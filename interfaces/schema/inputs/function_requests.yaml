# Khối ADAS phát FunctionRequests ở 40 Hz (ICD 5.6).
icd: "5.6"
constants:
  FUNCTIONS: {type: uint, value: 3, doc: "Thứ tự requests: LCC, LKA, ELK."}
  FUNCTION_REQUESTS_TIMEOUT_US: {type: uint64, value: 75000}
  FUNCTION_REQUESTS_MAX_DELTA_COUNTER: {type: uint, value: 4, doc: "Bước counter lớn nhất theo ICD 4: floor((75 + 25) / 25), với thời gian tính bằng ms."}
  FUNCTION_REQUESTS_MAX_AGE_US: {type: uint64, value: 45000}
enums:
  RequestState:
    values: {OFF: 0, UNAVAILABLE: 1, STANDBY: 2, REQUEST: 3, FAULT: 4}
  ElkReason:
    values: {NONE: 0, SOLID_LINE: 1, ROAD_EDGE: 2, ONCOMING: 3, OVERTAKING: 4}
  CancelReason:
    values: {NONE: 0, DRIVER_OVERRIDE: 1, INDICATOR: 2, SPEED: 3, LANE_QUALITY: 4, ESC: 5, FAULT: 6}
structs:
  FunctionRequest:
    fields:
      - {name: state, type: RequestState}
      - {name: side, type: Side, doc: "Phía xe đang lệch. LCC dùng NONE."}
      - {name: tlc, type: float32, unit: s, doc: "Khối ADAS tính TLC. LCC không dùng giá trị này."}
      - {name: elk_reason, type: ElkReason, doc: "ROAD_EDGE chọn mép đường đã quan sát cho ELK. Giá trị khác chỉ dùng ghi log."}
      - {name: cancel_reason, type: CancelReason, doc: "Chỉ dùng ghi log."}
  FunctionRequests:
    fields:
      - {name: header, type: BasicHeader, doc: "stamp_us theo thời điểm phát."}
      - {name: requests, type: FunctionRequest, count: FUNCTIONS}
      - {name: driver_override, type: bool}
