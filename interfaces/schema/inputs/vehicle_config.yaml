# Planner đọc VehicleConfig một lần khi khởi tạo (ICD 5.8).
icd: "5.8"
constants:
  MAX_VEHICLE_WIDTH_M: {type: float, value: 2.5, doc: "Tính cả gương, QCVN 09:2015/BGTVT 2.1.1.1 b."}
structs:
  VehicleConfig:
    doc: "Nguồn tham số xe của planner."
    fields:
      - {name: wheelbase, type: float32, unit: m}
      - {name: rear_axle_to_cg, type: float32, unit: m}
      - {name: vehicle_width, type: float32, unit: m, doc: "Tính cả gương."}
      - {name: steering_ratio, type: float32, unit: "-"}
      - {name: max_wheel_angle, type: float32, unit: rad}
      - {name: max_steering_wheel_rate, type: float32, unit: rad/s}
      - {name: actuator_delay, type: float32, unit: s, doc: "Độ trễ danh định của EPS."}
