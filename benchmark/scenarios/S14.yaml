# S14 Ngang và dọc trao đổi ràng buộc (Software Qualification Test Specification section 5).
# Each variant runs twice: the stand-in ACC reads LateralLimits ('on') and ignores them
# ('ignore_limits'); the second run is selected with eval.runner --acc ignore_limits.
# b and c need other vehicles; d needs a LongitudinalPlan drop: later.
id: S14
title: Ngang và dọc trao đổi ràng buộc
defaults:
  lane_width_m: 3.5
  profile: VP-0
  hwa_request_s: 1.0
  start_s_m: 10.0
  acc: "on"
variants:
  a:
    description: như S1b a (90 km/h, R = 200 m)
    speed_kmh: 90
    duration_s: 13
    road:
      - {straight: 150}
      - {clothoid: 100, radius_end: 200}
      - {arc: 200, radius: 200}
