<!doctype html>
<html lang="vi" class="report-page">
<head>
<meta charset="utf-8">
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="github-repository" content="">
<title>Tài liệu kỹ thuật</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="reviews.css">
</head>
<body>
<header class="report-header">
  <nav id="report-navigation" class="report-navigation" aria-label="Tài liệu kỹ thuật" data-i18n-aria>
    <a id="report-back" class="report-back" href="home/">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6M6 10h10"/></svg>
      <span data-i18n>Trang chủ</span>
    </a>
    <a id="report-index-back" class="report-back" href="technical-documents/" data-i18n hidden>Tài liệu kỹ thuật</a>
  </nav>
  <div class="report-controls">
    <button type="button" id="report-fit" class="report-fit" aria-label="Vừa chiều ngang" aria-pressed="false" aria-controls="doc-page" data-i18n-aria hidden>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4v12M17 4v12M5.5 10h9M8 7.5 5.5 10 8 12.5m4-5 2.5 2.5-2.5 2.5"/></svg>
      <span class="report-fit-label" data-i18n>Vừa chiều ngang</span>
    </button>
    <div id="language-switch" class="language-switch" role="group" aria-label="Ngôn ngữ" data-i18n-aria>
      <button type="button" lang="vi" aria-label="Tiếng Việt" aria-pressed="true">VI</button>
      <button type="button" lang="en" aria-label="English" aria-pressed="false">EN</button>
    </div>
  </div>
</header>
<main id="report-catalog" class="report-catalog" hidden></main>
<main class="doc-desk">
  <div class="doc-toolbar">
    <p id="doc-versions" class="doc-versions" role="status"></p>
    <button type="button" id="review-list" class="review-button" aria-controls="review-panel" aria-expanded="false" hidden></button>
  </div>
  <article id="doc-page" class="doc-page" contenteditable="false" spellcheck="false">
    <h1>Tài liệu kỹ thuật</h1>
  </article>
  <div id="review-marks" class="review-marks"></div>
</main>
<p id="doc-save" class="doc-save" aria-live="polite"></p>

<button type="button" id="review-prompt" class="review-prompt" aria-controls="review-panel" data-i18n hidden>Nhận xét</button>
<aside id="review-panel" class="review-panel" role="dialog" aria-labelledby="review-title" hidden>
  <header class="review-head">
    <h2 id="review-title"></h2>
    <button type="button" id="review-close" class="review-close" aria-label="Đóng" data-i18n-aria>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10m0-10L5 15"/></svg>
    </button>
  </header>
  <div id="review-content" class="review-content"></div>
  <form id="review-form" class="review-form" hidden>
    <textarea id="review-input" aria-label="Nội dung nhận xét" data-i18n-aria maxlength="6000" rows="3" required></textarea>
    <div class="review-actions">
      <select id="review-severity" class="review-severity" aria-label="Mức độ nhận xét" data-i18n-aria>
        <option value="major" data-i18n>Lớn</option>
        <option value="minor" data-i18n selected>Nhỏ</option>
        <option value="question" data-i18n>Câu hỏi</option>
      </select>
      <button type="button" id="review-cancel-edit" class="review-button" data-i18n hidden>Hủy chỉnh sửa</button>
      <button type="submit" id="review-save" class="review-button review-primary"></button>
    </div>
  </form>
  <p id="review-status" class="review-status" role="status"></p>
</aside>

<script src="cards.js"></script>
<script src="en/strings.js"></script>
<script src="docmd.js"></script>
<script src="reviews.js"></script>
<script src="app.js"></script>
</body>
</html>
