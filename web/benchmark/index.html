<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benchmark</title>
<style>
  :root { --bg: #FFFFFF; --surface-2: #E8E8ED; --surface-3: #D2D2D7; --hair: #0000001A; --text: #1D1D1F; --violet: #5B3DF5; --violet-tint: #5B3DF514; --violet-tint-hover: #5B3DF50D; --focus: #5B3DF5; --plane: #E8E8ED; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; background: var(--bg); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; letter-spacing: -.01em; -webkit-font-smoothing: antialiased; color: var(--text); }
  nav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 8px 16px; border-bottom: 1px solid var(--hair); background: var(--bg); }
  a { color: var(--violet); text-underline-offset: 3px; border-radius: 8px; padding: 4px 8px; margin-left: -8px; text-decoration: none; }
  a:hover { background: var(--violet-tint-hover); }
  button { margin-left: auto; padding: 6px 12px; border: 0; border-radius: 12px; background: var(--surface-2); color: var(--text); font: inherit; cursor: pointer; }
  button:hover { background: var(--violet-tint); color: var(--violet); }
  button:active { background: var(--surface-3); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  iframe { display: block; width: 100%; flex: 1; min-height: 0; border: 0; background: var(--plane); }
</style>
</head>
<body>
<nav aria-label="Benchmark">
  <a id="home" href="../home/?lang=vi">← Trang chủ</a>
  <button id="fullscreen" type="button" hidden>Toàn màn hình</button>
</nav>
<iframe id="report" title="Benchmark"></iframe>
<script>
  const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "vi";
  const home = document.getElementById("home");
  const report = document.getElementById("report");
  const fullscreen = document.getElementById("fullscreen");
  const english = lang === "en";
  document.documentElement.lang = lang;
  home.href = "../home/" + (location.protocol === "file:" ? "index.html" : "") + "?lang=" + lang;
  if (english) home.textContent = "← Home";
  report.src = english ? "run/report-en.html" : "run/report.html";
  if (document.fullscreenEnabled) {
    fullscreen.hidden = false;
    function updateFullscreen() {
      const active = Boolean(document.fullscreenElement);
      fullscreen.textContent = active ? (english ? "Exit fullscreen" : "Thoát toàn màn hình")
        : (english ? "Fullscreen" : "Toàn màn hình");
    }
    fullscreen.addEventListener("click", async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch {
        fullscreen.hidden = true;
      }
    });
    document.addEventListener("fullscreenchange", updateFullscreen);
    updateFullscreen();
  }
</script>
</body>
</html>
