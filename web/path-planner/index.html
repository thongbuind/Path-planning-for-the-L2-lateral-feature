<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Path Planner – flow xử lý một tick</title>
<style>
:root{
  --bg:#FFFFFF; --surface-1:#F5F5F7; --surface-2:#E8E8ED; --line:#D2D2D7; --hair:#0000001A;
  --text:#1D1D1F; --text-2:#6E6E73; --text-3:#86868B;
  --violet:#5B3DF5; --violet-tint:#5B3DF514; --violet-tint-strong:#5B3DF526;
  --ok:#1E7B34; --ok-tint:#34C75921; --warn:#B25000; --warn-tint:#FF950021; --danger:#D70015;
  --blue:#2563EB;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#fff;overflow:hidden;font-family:var(--sans);color:var(--text);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--bg)}
code,.mono{font-family:var(--mono)}
code{color:var(--violet);font-size:.92em}
b{font-weight:600}

.page-title{display:flex;align-items:center;gap:20px}
#back-home{color:var(--violet);font-size:18px;font-weight:600;text-decoration:none}
#back-home:hover{text-decoration:underline}
#back-home:focus-visible{outline:2px solid var(--violet);outline-offset:4px}
header{position:absolute;left:40px;right:40px;top:22px;height:68px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:38px;font-weight:700;letter-spacing:-.02em}
#stepper{display:flex;align-items:center}
.st{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:16px;font-weight:600;
  color:var(--text-2);cursor:pointer;transition:all .3s;background:var(--bg)}
.st.done{border-color:var(--violet);color:var(--violet)}
.st.on{background:var(--violet);border-color:var(--violet);color:#fff}
.sl{width:24px;height:2px;background:var(--line);transition:background .3s}
.sl.done{background:var(--violet)}
#exs{position:absolute;left:560px;top:32px;height:44px;padding:0 20px;border-radius:22px;background:var(--warn-tint);
  color:var(--warn);font-size:19px;font-weight:600;line-height:44px;white-space:nowrap}

.rv{opacity:0;transform:translate(var(--tx,0),var(--ty,0)) scale(var(--sc,1));
  transition:opacity .6s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.abs{position:absolute}

#intro{position:absolute;left:0;right:0;top:110px;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  opacity:0;pointer-events:none;transition:opacity .6s}
#intro.show{opacity:1}
#intro .big{font-size:96px;font-weight:700;letter-spacing:-.03em}
#intro .mid{font-size:34px;color:var(--text-2)}
#intro .help{margin-top:10px;font-size:20px;color:var(--text-2)}

.colh{position:absolute;font-size:16px;letter-spacing:.12em;font-weight:600;color:var(--text-2)}
.inp{position:absolute;left:40px;width:520px;height:56px;border-radius:14px;background:var(--surface-1);padding:6px 16px 0 16px}
.inp.fn{background:var(--bg);border:1.5px dashed var(--line);padding-top:5px}
.inp .r1{display:flex;align-items:baseline;gap:10px;line-height:22px}
.inp .r1 b{font-size:18px}
.inp .r1 i{font-style:normal;font-size:13.5px;font-family:var(--mono);color:var(--text-2);background:var(--surface-2);border-radius:6px;padding:0 7px;line-height:19px}
.inp .r1 em{margin-left:auto;font-style:normal;font-size:14px;color:var(--text-2)}
.inp .r2{font-size:14.5px;color:var(--text-2);line-height:22px;white-space:nowrap}
#band{left:574px;top:146px;width:76px;height:428px;border-radius:14px;background:var(--violet-tint);display:grid;place-items:center}
#band span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:18px;letter-spacing:.06em;color:var(--violet);font-weight:600;white-space:nowrap}
#state{left:40px;top:590px;width:520px;height:102px;border-radius:14px;border:1.5px dashed var(--line);background:var(--bg);padding:12px 16px}
#state h4{font-size:17px;color:var(--warn);margin-bottom:9px;font-weight:600}
#state .chips{display:flex;flex-wrap:wrap;gap:6px}
#state .chips span{font-size:14.5px;background:var(--surface-1);color:var(--text);border-radius:7px;padding:3px 10px}

#core{left:690px;top:118px;width:640px;height:574px;border-radius:24px;border:1.5px solid var(--line);background:var(--bg)}
#core .chip{position:absolute;left:22px;top:-17px;display:flex;align-items:baseline;gap:12px;background:var(--bg);padding:0 10px;
  font-family:var(--mono);font-size:22px;font-weight:600;color:var(--text)}
#core .chip small{font-family:var(--sans);font-size:16px;font-weight:500;color:var(--text-2)}
.blk{position:absolute;left:712px;width:596px;height:74px;border-radius:14px;border:1.5px dashed var(--line);
  display:flex;align-items:center;gap:14px;padding:0 18px;overflow:hidden;
  transition:opacity .6s ease,transform .7s cubic-bezier(.2,.8,.2,1),border-color .4s,background .4s}
.blk .num{flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--text-3);display:grid;place-items:center;font-weight:600;font-size:19px;color:var(--text-2);transition:all .4s}
.blk .tx{min-width:0}
.blk .tt{font-size:21px;font-weight:600;color:var(--text-2);transition:color .4s;white-space:nowrap}
.blk .sb{font-size:15.5px;color:var(--text-2);margin-top:3px;opacity:0;transform:translateY(5px);transition:all .5s .15s;white-space:nowrap}
.blk.active{border:1.5px solid var(--violet);background:var(--violet-tint)}
.blk.active .num{background:var(--violet);border-color:var(--violet);color:#fff}
.blk.active .tt{color:var(--text)}
.blk.active .sb,.blk.done .sb{opacity:1;transform:none}
.blk.done{border:1.5px solid transparent;background:var(--surface-1)}
.blk.done .num{border-color:var(--violet);color:var(--violet)}
.blk.done .tt{color:var(--text)}
.arr{position:absolute;left:1003px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--text-3)}

.out{position:absolute;left:1400px;width:480px;height:182px;border-radius:16px;background:var(--surface-1);padding:20px 24px}
.out .o1{display:flex;align-items:baseline;gap:10px}
.out .o1 b{font-size:26px;font-weight:600}
.out .o1 i{font-style:normal;font-family:var(--mono);font-size:14px;background:var(--ok-tint);color:var(--ok);border-radius:6px;padding:0 8px;line-height:20px}
.out .o2{font-size:19px;color:var(--ok);margin-top:12px;font-weight:500}
.out .o3{font-size:17px;color:var(--text-2);margin-top:10px;line-height:1.4}

#wires{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
.wire{fill:none;stroke-width:2;opacity:0;transition:opacity .6s}
.wire.in{opacity:1}
.wire.b{stroke:var(--violet)}.wire.a{stroke:var(--warn);stroke-dasharray:6 6}.wire.g{stroke:var(--ok)}
.wlab{font-size:14.5px;fill:var(--warn);opacity:0;transition:opacity .6s}
.wlab.in{opacity:1}

#detail{position:absolute;left:0;right:0;top:735px;bottom:0;transition:opacity .5s}
#detail.hide{opacity:0}
#txt{position:absolute;left:40px;top:2px;width:712px;height:330px}
#vis{position:absolute;left:770px;top:6px;width:1110px;height:312px;border-radius:20px;background:var(--surface-1)}
#vis svg{width:100%;height:100%;display:block}
.th{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.th .bn{flex:none;width:46px;height:46px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:600;
  animation:pop2 .5s cubic-bezier(.2,1.4,.4,1) both}
.th h2{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.2;animation:fup .5s .1s both}
@keyframes pop2{from{transform:scale(.3);opacity:0}}
ul.bl{list-style:none}
ul.bl li{position:relative;padding-left:26px;font-size:25px;line-height:1.3;color:var(--text);margin-bottom:14px;opacity:0;animation:fup .55s both}
ul.bl li::before{content:"";position:absolute;left:0;top:.5em;width:9px;height:9px;border-radius:50%;background:var(--violet)}
ul.bl li.ex{color:var(--warn)}
ul.bl li.ex::before{background:var(--warn)}
@keyframes fup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

svg text{fill:var(--text);font-family:var(--sans);font-size:16px}
.sm{fill:var(--text-2)}.md{font-size:18px}.lg{font-size:21px;font-weight:600}.cap{fill:var(--text-2);font-size:16px;letter-spacing:.05em;font-weight:600}
.mono{font-family:var(--mono)}.amber{fill:var(--warn)}.blue{fill:var(--violet)}.green{fill:var(--ok)}.red{fill:var(--danger)}
.draw{stroke-dasharray:1 2;stroke-dashoffset:1;animation:draw var(--dur,1s) var(--delay,0s) cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .45s var(--delay,0s) cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
.fade{opacity:0;animation:fadein .6s var(--delay,0s) ease forwards}
@keyframes fadein{to{opacity:1}}
.shift{animation:shift 1.6s var(--delay,1.6s) cubic-bezier(.5,0,.2,1) forwards}
@keyframes shift{to{transform:translate(0,46px)}}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important;transition-delay:0s!important}
}

header .st{font-family:inherit}
.blk{cursor:pointer;text-align:left;color:inherit;font:inherit}
.blk:not(.in),#detail.hide{visibility:hidden}
.blk .tt,.blk .sb{display:block}
.blk .sb{overflow:hidden;text-overflow:ellipsis}
#txt{height:320px;display:flex;flex-direction:column}
.th{margin-bottom:12px;gap:13px}
.th .bn{font-size:16px;width:auto;min-width:46px;height:36px;padding:0 10px;border-radius:18px}
.th h2{font-size:30px}
ul.bl li{font-size:22px;line-height:1.27;margin-bottom:10px;padding-left:20px}
ul.bl li:before{width:7px;height:7px}
ul.bl li code{overflow-wrap:anywhere}
#scene-nav{display:flex;align-items:center;gap:7px;margin-top:auto;padding:8px 0 0;color:var(--text-2)}
#scene-nav .source{font-size:14px;margin-right:auto;white-space:nowrap}
#scene-nav button{background:#fff;color:var(--text-2);border:1px solid var(--line);border-radius:7px;width:29px;height:28px;font:600 14px var(--sans);cursor:pointer}
#scene-nav button[aria-current=true]{background:var(--violet);color:#fff;border-color:var(--violet)}
#scene-nav button:disabled{opacity:.3;cursor:default}
button:focus-visible{outline:2px solid var(--violet);outline-offset:3px}
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="page-title">
      <h1>Path Planner</h1>
      <a id="back-home" href="../home/index.html">← Trang chủ</a>
    </div>
    <nav id="stepper" aria-label="Các bước"></nav>
  </header>

  <div id="exs" class="rv" data-step="0" data-d="0.4" style="--ty:-10px">Ví dụ: bật HWA · 90 km/h · lệch phải 0,30 m</div>

  <div id="intro">
    <div class="big">Path Planner</div>
    <div class="mid">Kiến trúc và cách xử lý trong một lần gọi <code>pp_step()</code></div>
    <p class="help">← / → để chuyển nhịp. Chọn số 0–7 để đến thẳng từng bước.</p>
  </div>

  <div id="main"></div>
  <svg id="wires" viewBox="0 0 1920 1080"></svg>

  <section id="detail" class="hide">
    <div id="txt"></div>
    <div id="vis" aria-hidden="true"></div>
  </section>

</div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let cur=-2;
const D=s=>`style="--delay:${s}s"`;
const sm=u=>u*u*(3-2*u), q5=u=>10*u**3-15*u**4+6*u**5;
const P=pts=>pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
const mk=(id,c)=>`<marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`;
const dpath=(d,cls,delay,dur,extra='')=>`<path d="${d}" pathLength="1" class="draw ${cls}" style="--delay:${delay}s;--dur:${dur}s" fill="none" ${extra}/>`;

const INPUTS=[
 ['LaneModel','20 Hz','Lane Model','vạch làn, mép đường (đa thức bậc 3)'],
 ['ObjectList','20 Hz','Perception','vật thể quanh xe'],
 ['Chassis CAN','100·100·50 Hz','Xe','tốc độ, yaw rate, góc lái'],
 ['VehicleStateEstimate','50 Hz','State Estimator','vận tốc ngang v_y'],
 ['FunctionRequests','40 Hz','Chức năng ADAS','yêu cầu HWA, LKA, ELK · TLC · ghi đè'],
 ['LongitudinalPlan','40 Hz','Khối dọc','v(t), a(t) dọc dự kiến'],
 ['EgoMotionQuery','gọi hàm','Ego-motion','dx, dy, dyaw giữa hai thời điểm'],
];
const BLOCKS=[
 [2,'Kiểm input và bù độ trễ','T1 · dữ liệu tại t₀'],
 [3,'Tâm làn, độ cong và trạng thái ngang','T2, T3, T5, T6 · hình học và trạng thái xe'],
 [4,'Arbitration','T9 · chọn ELK, LKA, HWA hoặc NONE'],
 [5,'Sinh path ngang và dọc','T8, T4, T7 · đích, trạng thái đầu và ứng viên'],
 [6,'Giới hạn và giữ liên tục','T10, T4 · kiểm ứng viên, trộn, kiểm path gửi'],
 [7,'Xuất ba bản tin','T11 · Trajectory, PathStatus, LateralLimits'],
];
const OUTS=[
 ['Trajectory','40 Hz','→ Lateral Controller','31 điểm, 0–3 s'],
 ['PathStatus','40 Hz','→ ADAS, Lateral Controller','path hợp lệ, chức năng đang lái'],
 ['LateralLimits','40 Hz','→ Khối dọc','tốc độ giới hạn trước cua'],
];

function build(){
  let h='';
  h+=`<div class="colh rv" data-step="1" style="left:40px;top:116px;--tx:-30px">INPUT MỖI TICK</div>`;
  INPUTS.forEach((r,i)=>{
    h+=`<div class="inp rv ${i===6?'fn':''}" data-step="1" data-d="${.25+i*.11}" style="top:${146+i*62}px;--tx:-60px">
      <div class="r1"><b>${r[0]}</b><i>${r[1]}</i><em>${r[2]}</em></div><div class="r2">${r[3]}</div></div>`;
  });
  h+=`<div id="band" class="abs rv" data-step="1" data-d="1" style="--sc:.8"><span>HARNESS → ADAPTER → struct C</span></div>`;
  h+=`<div id="state" class="abs rv" data-step="1" data-d="1.1" style="--ty:30px">
        <h4>Trạng thái từ tick trước</h4>
        <div class="chips"><span>path cũ</span><span>bề rộng làn nhớ được</span><span>pha LKA / ELK</span></div></div>`;
  h+=`<div id="core" class="abs rv" data-step="0" style="--sc:.96">
        <div class="chip">pp_step(t0)<small>mỗi 25 ms · 40 Hz</small></div></div>`;
  BLOCKS.forEach((b,i)=>{
    const top=154+i*86, sub=b[2];
    h+=`<button type="button" class="blk rv ghost" data-flow="${b[0]}" data-step="0" data-d="${.6+i*.14}" data-blk="${b[0]}" id="b${b[0]}" style="top:${top}px;--ty:-18px">
          <span class="num">${b[0]}</span><span class="tx"><span class="tt">${b[1]}</span><span class="sb">${sub}</span></span></button>`;
    if(i<5) h+=`<div class="arr rv" data-step="0" data-d="${.7+i*.14}" style="top:${top+75}px"></div>`;
  });
  OUTS.forEach((o,i)=>{
    h+=`<div class="out rv" data-step="7" data-d="${.5+i*.2}" style="top:${118+i*196}px;--tx:60px">
      <div class="o1"><b>${o[0]}</b><i>${o[1]}</i></div><div class="o2">${o[2]}</div><div class="o3">${o[3]}</div></div>`;
  });
  $('#main').innerHTML=h;

  let w=`<defs>${mk('wb','#5B3DF5')}${mk('wa','#B25000')}${mk('wg','#1E7B34')}</defs>`;
  INPUTS.forEach((r,i)=>{const y=174+i*62; w+=`<path class="wire b" data-step="1" data-d="${.5+i*.1}" d="M560 ${y} L574 ${y}" marker-end="url(#wb)"/>`;});
  w+=`<path class="wire b" data-step="1" data-d="1.4" d="M650 360 L688 360" marker-end="url(#wb)"/>`;
  w+=`<path class="wire a" data-step="1" data-d="1.5" d="M560 641 L688 641" marker-end="url(#wa)"/>`;
  [209,405,601].forEach((y,i)=>{
    const c=i===2?`M1310 621 C1356 621 1356 ${y} 1398 ${y}`:`M1310 621 C1365 621 1360 ${y} 1398 ${y}`;
    w+=`<path class="wire g" data-step="7" data-d="${.1+i*.15}" d="${c}" marker-end="url(#wg)"/>`;
  });
  w+=`<path class="wire a" data-step="7" data-d="1.4" d="M1352 621 L1352 708 L300 708 L300 694" marker-end="url(#wa)"/>`;
  w+=`<circle class="wire" data-step="7" cx="1352" cy="621" r="4.5" fill="#B25000" stroke="none"/>`;
  w+=`<text class="wlab" data-step="7" data-d="1.6" x="830" y="727" text-anchor="middle">path vừa gửi là path cũ của tick sau</text>`;
  $('#wires').innerHTML=w;

  let s='';
  for(let i=0;i<8;i++){ s+=(i?`<div class="sl" data-sl="${i}"></div>`:'')+`<button type="button" class="st" data-flow="${i}" data-st="${i}" aria-label="Bước ${i}: ${STEPS[i].t}">${i}</button>`; }
  $('#stepper').innerHTML=s;
}

const scene=(unit,section,title,visual,...points)=>({unit,section,title,visual,points});
const STEPS=[
 {t:'Một tick của Path Planner', frames:[
  scene('§3','3','Một lần gọi pp_step() mỗi 25 ms',v0,
    'Tại <b>t₀</b>, planner dùng input mới nhất và trạng thái đã giữ từ tick trước.',
    'Mỗi path có <b>31 mẫu</b>, cách nhau 0,1 s, từ 0 đến 3 s.',
    'Các nhịp sau theo cùng ca HWA: 90 km/h, xe lệch phải 0,30 m. Các nhánh khác có ví dụ riêng.')
 ]},
 {t:'Input, cấu hình và bộ nhớ', frames:[
  scene('§3','3','Input không đến cùng nhịp',v1,
    'Harness lấy message; adapter chuyển sang struct C theo ICD rồi gọi <code>pp_step()</code>.',
    'Camera 20 Hz: hai tick 40 Hz có thể dùng chung frame. T1 vẫn bù về <b>t₀ của từng tick</b>.',
    'Planner giữ hình học làn, path và pha can thiệp trong bộ nhớ do bên gọi cấp.'),
  scene('§3','3','Calibration được kiểm tại pp_init',()=>vNodes('TRƯỚC TICK ĐẦU TIÊN',[
    ['YAML','calibration.yaml'],['Build','Sinh struct C hằng'],['pp_init','Kiểm giới hạn theo SRS §7'],['pp_step','Tính double, xuất float32']
  ],'Calibration ngoài dải hoặc thiếu VehicleConfig: không gửi Trajectory.'),
    'Planner dùng C11 và chỉ phụ thuộc header <code>interfaces/c/</code>.',
    'Không cấp phát động, đọc file hay giữ biến toàn cục. <code>pp_math.c</code> chứa phép khớp bậc 3 và giải hệ 4×4.')
 ]},
 {t:'Kiểm input và bù độ trễ',frames:[
  scene('T1','4','Giữ bản tin hợp lệ gần nhất',vInputGate,
    'Lớp nhận loại CAN sai CRC/counter lặp; counter nhảy được ghi nhận là mất frame.',
    'Pub/sub: bản tin bị loại hoặc <code>valid=false</code> không thay bản đang giữ.',
    'Vượt timeout, tuổi >250 ms hoặc stamp ở tương lai >10 ms: input không hợp lệ. Tuổi >170 ms: ghi log.'),
  scene('T1','4','Từ frame camera đến base_link tại t₀',v2,
    'Tra ego-motion từ <b>t_c</b> đến <b>t₀</b>. Nếu không hợp lệ, báo <code>path_valid=false</code>.',
    'Lấy mẫu mỗi 1 m, đổi tọa độ từng điểm rồi khớp lại đa thức bậc 3. Tầm nhìn lùi theo Δx.',
    'VD:Ở 25 m/s, frame cũ 105 ms cho Δx = <b>2,625 m</b>.'),

const W='<svg viewBox="0 0 1110 312" xmlns="http://www.w3.org/2000/svg">';

function v0(){
  const bx=[100,270,440], nm=['tick n−2','tick n−1','tick n'], tl=['t0 − 50 ms','t0 − 25 ms','t0'];
  let s=W+`<defs>${mk('va','#5B3DF5')}${mk('vb','#B25000')}${mk('vm','#6E6E73')}</defs>`;
  s+=`<text class="cap" x="24" y="34">THỜI GIAN · MỘT TICK MỖI 25 ms</text><text class="cap" x="600" y="34">ĐẦU RA CỦA TICK n · PATH 3 s</text>`;
  s+=`<line x1="30" y1="226" x2="530" y2="226" stroke="#AEAEB2" stroke-width="2"/>`;
  bx.forEach((x,i)=>{
    const hot=i===2, d=.3+i*.45;
    s+=`<g class="fade" ${D(d)}>
      <text class="sm" x="${x}" y="84" text-anchor="middle">${nm[i]}</text>
      <rect x="${x-55}" y="96" width="110" height="58" rx="12" fill="${hot?'#FFF4E5':'#FFFFFF'}" stroke="${hot?'#B25000':'#AEAEB2'}" stroke-width="2.2"/>
      <text class="mono md ${hot?'amber':''}" x="${x}" y="132" text-anchor="middle" style="font-weight:700">pp_step()</text>
      <line x1="${x}" y1="154" x2="${x}" y2="226" stroke="#AEAEB2" stroke-dasharray="3 5"/>
      <circle cx="${x}" cy="226" r="6.5" fill="${hot?'#B25000':'#8E8E93'}"/>
      <text class="${hot?'lg amber':'sm'}" x="${x}" y="256" text-anchor="middle">${tl[i]}</text></g>`;
  });
  [[100,270],[270,440]].forEach((p,i)=>{
    s+=`<path class="fade" ${D(.9+i*.45)} d="M${p[0]+60} 125 L${p[1]-63} 125" stroke="#B25000" stroke-width="2.2" fill="none" marker-end="url(#vb)"/>
        <text class="fade mono amber" ${D(1.0+i*.45)} x="${(p[0]+p[1])/2}" y="148" text-anchor="middle" style="font-size:14px">state</text>`;
  });
  s+=`<g class="fade" ${D(2)}><path d="M270 276 L440 276" stroke="#6E6E73" stroke-width="1.8" marker-start="url(#vm)" marker-end="url(#vm)"/>
      <text class="sm" x="355" y="300" text-anchor="middle">25 ms = 40 Hz</text></g>`;
  s+=dpath('M505 125 C575 125 590 160 596 205','','2.3','.8','stroke="#5B3DF5" stroke-width="2.4" marker-end="url(#va)"');
  const x0=640,x1=1070,pt=u=>[x0+u*(x1-x0),214-100*sm(u)];
  const pts=[...Array(31)].map((_,k)=>pt(k/30));
  s+=dpath(P(pts),'', '2.9','1.2','stroke="#5B3DF5" stroke-width="3" stroke-linecap="round" opacity=".55"');
  pts.forEach((p,k)=>{
    const big=k%10===0;
    s+=`<circle class="pop" ${D(3.0+k*.045)} cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${big?7:4.2}" fill="${big?'#5B3DF5':'#C4BBFF'}"/>`;
  });
  [[0,'t0'],[10,'+1 s'],[20,'+2 s'],[30,'+3 s']].forEach(([k,l])=>{
    const p=pts[k];
    s+=`<g class="fade" ${D(3.0+k*.045)}><line x1="${p[0]}" y1="${p[1]+9}" x2="${p[0]}" y2="248" stroke="#AEAEB2" stroke-dasharray="3 5"/>

  });
  s+=`<text class="fade lg" ${D(4.2)} x="855" y="302" text-anchor="middle">31 điểm · bước 0,1 s</text>`;

}

function v1(){
  const X0=282,K=4.4,T0=100,x=t=>X0+t*K;
  const rows=[['LaneModel','20 Hz',50,8],['VehicleStateEstimate','50 Hz',20,4],['FunctionRequests','40 Hz',25,12],['IMU_Data','100 Hz',10,3]];
  const ys=[104,156,208,260];
  let s=W+`<defs>${mk('va','#5B3DF5')}</defs>`;
  s+=`<text class="cap" x="24" y="30">MESSAGE MỚI NHẤT TẠI MỖI TICK</text>`;
  s+=`<text class="sm" x="24" y="64" >tick planner</text>`;
  [0,25,50,75,100].forEach((t,i)=>{
    const hot=t===T0;
    s+=`<g class="fade" ${D(.2+i*.12)}><line x1="${x(t)}" y1="${hot?66:72}" x2="${x(t)}" y2="284" stroke="${hot?'#B25000':'#D2D2D7'}" stroke-width="${hot?2.4:1.4}" stroke-dasharray="${hot?'':'4 6'}"/>
      <rect x="${x(t)-9}" y="52" width="18" height="18" rx="5" fill="${hot?'#B25000':'#D2D2D7'}"/></g>`;
  });
  s+=`<text class="fade lg amber" ${D(.9)} x="${x(T0)}" y="44" text-anchor="middle">t0</text>`;
  rows.forEach(([n,r,p,o],ri)=>{
    const y=ys[ri];
    s+=`<g class="fade" ${D(.3+ri*.1)}><text class="md" x="24" y="${y-3}" style="font-weight:650">${n}</text><text class="sm mono" x="24" y="${y+17}" style="font-size:14px">${r}</text>
        <line x1="${X0-10}" y1="${y}" x2="${x(128)}" y2="${y}" stroke="#E8E8ED" stroke-width="1.6"/></g>`;
    const ts=[];for(let t=o;t<=125;t+=p)ts.push(t);
    const last=Math.max(...ts.filter(t=>t<=T0));
    ts.forEach((t,k)=>{
      const isLast=t===last, fut=t>T0;
      s+=`<circle class="pop" ${D(.8+ri*.1+k*.03)} cx="${x(t)}" cy="${y}" r="${isLast?9:5}" fill="${fut?'none':isLast?'#5B3DF5':'#8E8E93'}" stroke="${fut?'#8E8E93':isLast?'#A898FF':'none'}" stroke-width="${isLast?2:1.5}"/>`;

function kChart(ax,aw,A,d0){

    <text class="sm mono" x="${ax+aw}" y="${ay+22}" text-anchor="end" style="font-size:15px">t: 0 → 3 s</text><text class="sm mono" x="${ax-8}" y="${ay-186}" text-anchor="end" style="font-size:15px">|κ|</text>`;
  s+=dpath(P([...Array(61)].map((_,i)=>[X(i/60),Y(H(i/60))])),'',d0,1.2,'stroke="#B25000" stroke-width="2.6"');
  s+=`<g class="fade" ${D(d0+1)}><line x1="${ax}" y1="${Y(LIM)}" x2="${ax+aw}" y2="${Y(LIM)}" stroke="#D70015" stroke-width="2" stroke-dasharray="8 6"/><text class="red mono" x="${ax+8}" y="${Y(LIM)+20}" style="font-size:15px">giới hạn</text></g>`;
  let top=[],bot=[];for(let i=0;i<=120;i++){const u=i/120;if(H(u)>LIM){top.push([X(u),Y(H(u))]);bot.push([X(u),Y(LIM)])}}
  s+=`<path class="fade" ${D(d0+1.4)} d="${P(top)} ${P(bot.reverse()).replace('M','L')} Z" fill="#D70015" fill-opacity=".3" stroke="none"/>`;
  s+=dpath(P([...Array(61)].map((_,i)=>[X(i/60),Y(Math.min(H(i/60),LIM))])),'',d0+1.7,1.2,'stroke="#5B3DF5" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"');

  return s;
}

  return vRows('CÙNG ĐẦU VÀO: TRẠNG THÁI ĐẦU, ĐÍCH, CORRIDOR, GIỚI HẠN VÀ v(t)',[
    ['A · Quintic','Điều chỉnh thời lượng T','HWA và LKA/ELK'],
    ['B · Frenet','Lưới d cuối × T; lọc theo corridor và giới hạn','Phương án so sánh','amber'],
    ['C · QP','30 jerk ngang; ADMM; ràng buộc a_y và jerk','Tùy chọn build HWA']
  ],'B chấm theo jerk, thời lượng, lệch đích và lệch path cũ. C kiểm lại qua T4 và T10.');
}

function vBlend(){
  let s=flowSvg()+svgText(24,36,'GIẢM PHẦN CHÊNH LỆCH, GIỮ HƯỚNG VỀ ỨNG VIÊN','cap',16);
  const f=(t,a)=>[60+573*t,214-42*t-a*99*sm(t)];
  [[0,'#8E8E93','path cũ'],[1,'#B25000','ứng viên'],[.45,'#5B3DF5','path trộn']].forEach(([a,c,t],i)=>{
    const pts=Array.from({length:51},(_,k)=>f(k/50,a));
    s+=dpath(P(pts),'',.23+i*.33,.75,`stroke="${c}" stroke-width="${i===2?5:3}"`)+fade(svgText(482,pts[50][1]+(i===0?21:-7),t,i===2?'blue':i===1?'amber':'sm',17),.7+i*.4);
  });
  s+=fade(box(690,59,388,190)+svgText(710,91,'Ví dụ một điểm ngoài đoạn 0–1 s','sm',17)+
    svgText(710,125,'Δd = 0,10 m, cont_margin = 0,9','mono',16)+svgText(710,162,'0,9 × 0,05 / 0,10 = 0,45','blue mono',19)+
    svgText(710,197,'Nếu Δd là ràng buộc chặt nhất: λ=0,45','sm',16)+svgText(710,226,'Mức lệch còn 0,045 m','blue',18),.75);
  return s+svgText(24,287,'λ ≤ min(1, m·0,05/Δd, m·0,005/Δψ, m·0,0003/Δκ), với m = cont_margin.','mono',16)+'</svg>';
}

  const y=164, yt=110, yb=216;
  let s=flowSvg()+svgText(24,37,'CỜ THEO NGƯỠNG CÓ HYSTERESIS','cap',16)+seg(36,y,680,y,'#8E8E93',2)+seg(36,yt,680,yt,'#B25000',2,dash)+seg(36,yb,680,yb,'#1E7B34',2,dash);
  s+=svgText(39,100,'aysmax + delta_ay','amber',16)+svgText(39,y-9,'aysmax','sm',16)+svgText(39,yb+24,'aysmax − delta_ay','green',16);

    fade(seg(332,70,505,70,'#B25000',2,'marker-start="url(#vb)" marker-end="url(#vb)"')+svgText(419,61,'giữ T_flag/2','amber',16,'middle')+svgText(507,79,'bật cờ','amber',16),1.3);
  s+=fade(box(717,62,363,176)+svgText(738,98,'Báo cho điều khiển dọc','lg',20)+
    svgText(738,139,'v_max = √(a_y giới hạn / |κ|_max)','blue mono',16)+svgText(738,179,'distance = s tại |κ|_max','mono',17)+

function vHorizon(){
  let s=flowSvg()+svgText(24,37,'VÍ DỤ NỘI SUY KHI TẦM NHÌN CHỈ CÒN 73,75 m','cap',16);
  const x=t=>50+t/3*945;
  s+=seg(50,168,1040,168,'#8E8E93',2,aEnd);
  for(let i=0;i<=30;i++){
    const t=i/10;
    s+=fade(dot(x(t),168,i%10===0?7:4,i===30?'#B25000':'#5B3DF5'),.15+.022*i);
  }
  [0,1,2,3].forEach(t=>s+=svgText(x(t),204,t+' s','mono',16,'middle'));
  const h=x(2.95);
  s+=fade(seg(h,80,h,188,'#B25000',2,dash)+svgText(h-22,102,'view_end tại t = 2,95 s','amber',20,'end')+
    svgText(700,236,'x(2,9) = 72,5 m      x(3,0) = 75 m','mono',16),.95);
  return s+fade(svgText(24,287,'Ca HWA chính: view_end = 77,375 m, vượt x(3 s) = 75 m nên observed_horizon_s = 3 s.','sm',17),1.25)+'</svg>';
}

let sub=0;
const lastStep=STEPS.length-1;
const lastSub=n=>n<0?0:STEPS[n].frames.length-1;
const atEnd=()=>cur===lastStep&&sub===lastSub(cur);

function renderDetail(){
  const d=$('#detail');
  if(cur<0){
    d.classList.add('hide');
    $('#txt').innerHTML='';
    $('#vis').innerHTML='';
    return;
  }
  const S=STEPS[cur], F=S.frames[sub];
  const bullets=F.points.map((p,i)=>{
    const ex=p.startsWith('VD:');
    return `<li class="${ex?'ex':''}" style="animation-delay:${.12+i*.19}s">${ex?'Ví dụ: '+p.slice(3):p}</li>`;
  }).join('');
  const selectors=S.frames.length===1?'':S.frames.map((f,i)=>
    `<button type="button" data-scene="${i}" aria-label="Nhịp ${i+1}: ${f.title}" aria-current="${i===sub}">${i+1}</button>`
  ).join('');
  $('#txt').innerHTML=`<div class="th"><div class="bn">${F.unit}</div><h2>${F.title}</h2></div>
    <ul class="bl">${bullets}</ul>
    <nav id="scene-nav" aria-label="Các nhịp trong bước ${cur}">
      <span class="source">PP-SDD 1.20 §${F.section} &nbsp;·&nbsp; Bước ${cur}, nhịp ${sub+1}/${S.frames.length}</span>
      <button type="button" data-nav="prev" aria-label="Nhịp trước">‹</button>
      ${selectors}
      <button type="button" data-nav="next" aria-label="Nhịp sau" ${atEnd()?'disabled':''}>›</button>
    </nav>`;
  $('#vis').innerHTML=F.visual();
  d.classList.remove('hide');

  $$('.blk .sb').forEach(el=>{
    const n=Number(el.closest('.blk').dataset.blk);
    el.textContent=n===cur?`${F.unit} · ${F.title}`:BLOCKS.find(b=>b[0]===n)[2];
  });
}
function apply(n){
  $$('[data-step]').forEach(el=>{
    const on=n>=Number(el.dataset.step);
    el.style.transitionDelay=on && n<=1?(el.dataset.d||0)+'s':'0s';
    el.classList.toggle('in',on);
  });
  $$('.blk').forEach(b=>{
    const k=Number(b.dataset.blk);
    b.classList.toggle('active',k===n);
    b.classList.toggle('done',k<n);
    b.classList.toggle('ghost',k>n);
  });
  $$('.st').forEach(e=>{
    const k=Number(e.dataset.st);
    e.classList.toggle('on',k===n);
    e.classList.toggle('done',k<n);
    e.setAttribute('aria-current',String(k===n));
  });
  $$('.sl').forEach(e=>e.classList.toggle('done',Number(e.dataset.sl)<=n));
  $('#intro').classList.toggle('show',n<0);
}

function go(n,i=0){
  n=Math.max(-1,Math.min(lastStep,n));
  i=Math.max(0,Math.min(lastSub(n),i));
  if(n===cur&&i===sub)return;
  const stepChanged=n!==cur;
  cur=n; sub=i;
  if(stepChanged)apply(n);
  renderDetail();
  try{history.replaceState(null,'',n<0?'#intro':`#${n}${i?'.'+(i+1):''}`)}catch(e){}
}
function next(){if(!atEnd()) sub<lastSub(cur)?go(cur,sub+1):go(cur+1)}
function prev(){sub>0?go(cur,sub-1):go(cur-1,lastSub(cur-1))}
function fit(){
  const s=Math.min(innerWidth/1920,innerHeight/1080)||1;
  $('#stage').style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`;
}
addEventListener('resize',fit);
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key;
  if(e.target?.closest?.('button, a')&&[' ','Enter'].includes(k))return;
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k)){e.preventDefault();next()}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){e.preventDefault();prev()}
  else if(k==='Home'){e.preventDefault();go(-1)}
  else if(k==='End'){e.preventDefault();go(lastStep,lastSub(lastStep))}
  else if(/^[0-7]$/.test(k))go(Number(k));
  else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}
});
addEventListener('click',e=>{
  if(e.target.closest('a[href]'))return;
  const b=e.target.closest('button');
  if(!b){next();return}
  if(b.dataset.flow!==undefined)go(Number(b.dataset.flow));
  else if(b.dataset.scene!==undefined){
    const n=b.dataset.scene;
    go(cur,Number(n));
    if(e.detail===0)$(`[data-scene="${n}"]`)?.focus();
  }
  else if(b.dataset.nav){
    const dir=b.dataset.nav;
    dir==='next'?next():prev();
    if(e.detail===0)$(`[data-nav="${dir}"]`)?.focus();
  }
});
let tx=null;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{
  if(tx===null)return;
  const dx=e.changedTouches[0].clientX-tx;tx=null;
  if(Math.abs(dx)>50){if(e.cancelable)e.preventDefault();dx<0?next():prev()}
},{passive:false});

build();fit();
const openScene=()=>{
  const m=location.hash.match(/^#([0-7])(?:\.(\d+))?$/);
  go(m?Number(m[1]):-1,m&&m[2]?Number(m[2])-1:0);
};
addEventListener('hashchange',openScene);
openScene();
</script>
